spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://auth-service:8081
            predicates:
              - Path=/api/auth/**
          - id: contratos-service
            uri: http://contratos-service:8082
            predicates:
              - Path=/api/contratos/**
          - id: pagamentos-service
            uri: http://pagamentos-service:8083
            predicates:
              - Path=/api/pagamentos/**
          - id: previsoes-service
            uri: http://previsoes-service:8084
            predicates:
              - Path=/api/previsoes/**
          - id: siop-service
            uri: http://siop-service:8085
            predicates:
              - Path=/api/siop/**
          - id: saldo-service
            uri: http://saldo-service:8086
            predicates:
              - Path=/api/saldo/**

ru-custos:
  jwt:
    secret: ${JWT_SECRET}
