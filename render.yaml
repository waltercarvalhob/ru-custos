services:
  - type: web
    name: ru-custos-auth
    runtime: docker
    plan: free
    dockerfilePath: ./backend/auth-service/Dockerfile
    dockerContext: ./backend/auth-service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        value: "ep-quiet-poetry-axtj7mb9-pooler.c-4.us-east-2.aws.neon.tech"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        value: "neondb_owner"
      - key: DB_PASSWORD
        value: "npg_wBYSesE5u4At"

  - type: web
    name: ru-custos-contratos
    runtime: docker
    plan: free
    dockerfilePath: ./backend/contratos-service/Dockerfile
    dockerContext: ./backend/contratos-service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        value: "ep-quiet-poetry-axtj7mb9-pooler.c-4.us-east-2.aws.neon.tech"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        value: "neondb_owner"
      - key: DB_PASSWORD
        value: "npg_wBYSesE5u4At"

  - type: web
    name: ru-custos-pagamentos
    runtime: docker
    plan: free
    dockerfilePath: ./backend/pagamentos-service/Dockerfile
    dockerContext: ./backend/pagamentos-service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        value: "ep-quiet-poetry-axtj7mb9-pooler.c-4.us-east-2.aws.neon.tech"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        value: "neondb_owner"
      - key: DB_PASSWORD
        value: "npg_wBYSesE5u4At"

  - type: web
    name: ru-custos-previsoes
    runtime: docker
    plan: free
    dockerfilePath: ./backend/previsoes-service/Dockerfile
    dockerContext: ./backend/previsoes-service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        value: "ep-quiet-poetry-axtj7mb9-pooler.c-4.us-east-2.aws.neon.tech"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        value: "neondb_owner"
      - key: DB_PASSWORD
        value: "npg_wBYSesE5u4At"

  - type: web
    name: ru-custos-siop
    runtime: docker
    plan: free
    dockerfilePath: ./backend/siop-service/Dockerfile
    dockerContext: ./backend/siop-service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        value: "ep-quiet-poetry-axtj7mb9-pooler.c-4.us-east-2.aws.neon.tech"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        value: "neondb_owner"
      - key: DB_PASSWORD
        value: "npg_wBYSesE5u4At"

  - type: web
    name: ru-custos-saldo
    runtime: docker
    plan: free
    dockerfilePath: ./backend/saldo-service/Dockerfile
    dockerContext: ./backend/saldo-service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        value: "ep-quiet-poetry-axtj7mb9-pooler.c-4.us-east-2.aws.neon.tech"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USER
        value: "neondb_owner"
      - key: DB_PASSWORD
        value: "npg_wBYSesE5u4At"
      - key: CONTRATOS_SERVICE_HOST
        fromService: { type: web, name: ru-custos-contratos, property: host }
      - key: PREVISOES_SERVICE_HOST
        fromService: { type: web, name: ru-custos-previsoes, property: host }
      - key: SIOP_SERVICE_HOST
        fromService: { type: web, name: ru-custos-siop, property: host }

  - type: web
    name: ru-custos-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/gateway/Dockerfile
    dockerContext: ./backend/gateway
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: AUTH_SERVICE_HOST
        fromService: { type: web, name: ru-custos-auth, property: host }
      - key: CONTRATOS_SERVICE_HOST
        fromService: { type: web, name: ru-custos-contratos, property: host }
      - key: PAGAMENTOS_SERVICE_HOST
        fromService: { type: web, name: ru-custos-pagamentos, property: host }
      - key: PREVISOES_SERVICE_HOST
        fromService: { type: web, name: ru-custos-previsoes, property: host }
      - key: SIOP_SERVICE_HOST
        fromService: { type: web, name: ru-custos-siop, property: host }
      - key: SALDO_SERVICE_HOST
        fromService: { type: web, name: ru-custos-saldo, property: host }

  - type: web
    name: ru-custos-frontend
    runtime: static
    buildCommand: >-
      cd frontend && npm ci &&
      printf 'export const environment = { production: true, apiBaseUrl: "https://%s.onrender.com/api" };' "$GATEWAY_HOST" > src/environments/environment.production.ts &&
      npm run build
    staticPublishPath: ./frontend/dist/frontend/browser
    envVars:
      - key: GATEWAY_HOST
        fromService: { type: web, name: ru-custos-gateway, property: host }
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
